name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip && pip install ".[dev]"
      - name: Run tests
        run: pytest -q

  minimum-versions:
    # check the lowest supported versions of the dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package with oldest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.23.*" "pandas==1.5.*" "scikit-learn==1.4.*" "scipy==1.9.*" "venn-abers==1.4.*"
          pip install --no-deps . && pip install pytest
      - name: Run tests
        run: pytest -q
